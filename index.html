<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추첨기</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
            --ball-shadow: rgba(0,0,0,0.1);
            --toggle-bg: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #f8f9fa;
            --btn-bg: #375a7f;
            --btn-hover: #2b4764;
            --ball-shadow: rgba(0,0,0,0.5);
            --toggle-bg: #444;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--toggle-bg);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        h1 {
            margin-bottom: 2rem;
        }

        #ball-container {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
            min-height: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 6px var(--ball-shadow);
            animation: bounce 0.5s ease-out;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .color-yellow { background-color: #fbc400; }
        .color-blue   { background-color: #69c8f2; }
        .color-red    { background-color: #ff7272; }
        .color-gray   { background-color: #aaaaaa; }
        .color-green  { background-color: #b0d840; }

        .draw-btn {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .draw-btn:hover {
            background-color: var(--btn-hover);
        }

        .draw-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
        <span id="theme-icon">🌙</span> <span id="theme-text">다크 모드</span>
    </button>

    <h1>로또 번호 추첨기</h1>

    <div id="ball-container"></div>

    <button class="draw-btn" onclick="generateLotto()">번호 추첨하기</button>

    <script>
        // 테마 관리
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const btnText = document.getElementById('theme-text');
            const btnIcon = document.getElementById('theme-icon');
            
            if (theme === 'dark') {
                btnText.textContent = '라이트 모드';
                btnIcon.textContent = '☀️';
            } else {
                btnText.textContent = '다크 모드';
                btnIcon.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        // 초기 테마 설정
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);

        // 로또 로직
        function getBallColorClass(num) {
            if (num <= 10) return 'color-yellow';
            if (num <= 20) return 'color-blue';
            if (num <= 30) return 'color-red';
            if (num <= 40) return 'color-gray';
            return 'color-green';
        }

        function generateLotto() {
            const container = document.getElementById('ball-container');
            container.innerHTML = '';

            const numbers = new Set();
            while (numbers.size < 6) {
                const randomNum = Math.floor(Math.random() * 45) + 1;
                numbers.add(randomNum);
            }

            const sortedNumbers = Array.from(numbers).sort((a, b) => a - b);

            sortedNumbers.forEach((num, index) => {
                setTimeout(() => {
                    const ball = document.createElement('div');
                    ball.className = `ball ${getBallColorClass(num)}`;
                    ball.textContent = num;
                    container.appendChild(ball);
                }, index * 100);
            });
        }
        
        window.onload = generateLotto;
    </script>
</body>
</html>
